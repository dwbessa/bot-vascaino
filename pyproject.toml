[project]
name = "vascobot"
version = "0.1.0"
description = "Digest automatizado de notícias do Vasco da Gama para X e Bluesky"
requires-python = ">=3.12"
dependencies = [
    "atproto>=0.0.55",
    "feedparser>=6.0",
    "httpx>=0.27",
    "ollama>=0.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "rapidfuzz>=3.10",
    "regex>=2024.9",
    "selectolax>=0.3",
    "structlog>=24.4",
    "trafilatura>=1.12",
    "typer>=0.13",
    "unidecode>=1.3",
]

[project.optional-dependencies]
dev = [
    "freezegun>=1.5",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-socket>=0.7",
    "respx>=0.21",
    "ruff>=0.8",
]

[project.scripts]
vascobot = "vascobot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "DTZ",       # datetime sem timezone  ⬅️ crítico neste projeto
    "T20",       # print()
    "SIM",       # simplify
    "RET",       # return
    "ARG",       # argumento não usado
    "PTH",       # pathlib
    "ERA",       # código comentado
    "PL",        # pylint
    "RUF",
    "S",         # bandit — segredo hardcoded, sql injection
    "ASYNC",     # chamada bloqueante em corrotina
]
ignore = [
    "PLR0913",   # muitos argumentos — comum em construtor de config
    "S101",      # assert: permitido em teste (ver per-file-ignores)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ARG", "PLR2004"]
"scripts/**" = ["T201"]  # scripts utilitários podem imprimir

[tool.ruff.lint.isort]
known-first-party = ["vascobot"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_untyped_decorators = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["feedparser.*", "selectolax.*", "trafilatura.*", "atproto.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Integração fica de fora por padrão — só via `make integration`
addopts = "-m 'not integration' --strict-markers --strict-config"
markers = [
    "contract: parsing contra fixtures reais em disco",
    "acceptance: critério de aceite CA-xx do spec.md",
    "integration: toca API real — nunca roda no CI",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["src/vascobot"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
